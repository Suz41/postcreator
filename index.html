<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PostCreator — Pro Social Media Post & Card Editor</title>
  <meta name="description" content="Create stunning social media text cards, quotes, and posts. Customize fonts, colors, layout, aspect ratios, and export high-res PNG images." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #09090c;
      --panel-bg: rgba(18, 19, 26, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-border-hover: rgba(255, 255, 255, 0.16);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --control-bg: rgba(255, 255, 255, 0.04);
      --control-border: rgba(255, 255, 255, 0.08);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.07), transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(14, 165, 233, 0.05), transparent 40%);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 14px calc(16px + env(safe-area-inset-bottom, 0px));
      gap: 12px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Minimal Top App Header */
    .app-header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: "Outfit", sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #fff;
    }

    .brand-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.16);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .header-hint {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-subtle);
      letter-spacing: 0.02em;
    }

    /* Main Workspace & Card Area: True Native Size */
    .card-workspace {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 0;
      flex: 0 0 auto;
    }

    .card {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 62px;
      gap: 16px;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: aspect-ratio 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.2s ease, background-color 0.2s ease, padding 0.2s ease;
      position: relative;
      box-sizing: border-box;
    }

    .card.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -6px;
    }

    .card-brand-footer,
    .card-watermark {
      position: absolute;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 7px;
      z-index: 10;
      pointer-events: auto;
      filter: none !important;
      box-shadow: none !important;
      text-shadow: none !important;
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-sizing: border-box;
    }

    .card-brand-footer.user-pos-right,
    .card-brand-footer.user-pos-beside {
      flex-direction: row;
      align-items: center;
    }

    .card-brand-footer.user-pos-left {
      flex-direction: row-reverse;
      align-items: center;
    }

    .card-brand-footer.user-pos-below {
      flex-direction: column;
      gap: 4px;
    }

    /* Keep below-logo aligned with corner, not jumping to center */
    .card-brand-footer.pos-bottom-right.user-pos-below,
    .card-brand-footer.pos-top-right.user-pos-below {
      align-items: flex-end !important;
      justify-content: flex-end !important;
    }

    .card-brand-footer.pos-bottom-left.user-pos-below,
    .card-brand-footer.pos-top-left.user-pos-below {
      align-items: flex-start !important;
      justify-content: flex-start !important;
    }

    .card-brand-footer.pos-bottom.user-pos-below,
    .card-brand-footer.pos-bottom-center.user-pos-below,
    .card-brand-footer.pos-top.user-pos-below,
    .card-brand-footer.pos-top-center.user-pos-below {
      align-items: center !important;
      justify-content: center !important;
    }

    /* Split opposite corner positions:
       When Logo is in Right corner -> Username is in Left corner.
       When Logo is in Left corner -> Username is in Right corner.
       When Logo is in Center -> Username is in Left corner.
    */
    .card-brand-footer.pos-bottom-right.brand-both.user-pos-opposite,
    .card-brand-footer.pos-bottom-right.brand-both.user-pos-left,
    .card-brand-footer.pos-bottom-right:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite,
    .card-brand-footer.pos-bottom-right:not(.brand-user-only):not(.brand-logo-only).user-pos-left {
      justify-content: space-between !important;
      flex-direction: row-reverse !important;
    }

    .card-brand-footer.pos-top-right.brand-both.user-pos-opposite,
    .card-brand-footer.pos-top-right.brand-both.user-pos-left,
    .card-brand-footer.pos-top-right:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite,
    .card-brand-footer.pos-top-right:not(.brand-user-only):not(.brand-logo-only).user-pos-left {
      justify-content: space-between !important;
      flex-direction: row-reverse !important;
    }

    .card-brand-footer.pos-bottom-left.brand-both.user-pos-opposite,
    .card-brand-footer.pos-bottom-left.brand-both.user-pos-right,
    .card-brand-footer.pos-bottom-left:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite,
    .card-brand-footer.pos-bottom-left:not(.brand-user-only):not(.brand-logo-only).user-pos-right {
      justify-content: space-between !important;
      flex-direction: row !important;
    }

    .card-brand-footer.pos-top-left.brand-both.user-pos-opposite,
    .card-brand-footer.pos-top-left.brand-both.user-pos-right,
    .card-brand-footer.pos-top-left:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite,
    .card-brand-footer.pos-top-left:not(.brand-user-only):not(.brand-logo-only).user-pos-right {
      justify-content: space-between !important;
      flex-direction: row !important;
    }

    .card-brand-footer.pos-bottom.brand-both.user-pos-opposite,
    .card-brand-footer.pos-bottom.brand-both.user-pos-left,
    .card-brand-footer.pos-bottom-center.brand-both.user-pos-opposite,
    .card-brand-footer.pos-bottom-center.brand-both.user-pos-left,
    .card-brand-footer.pos-bottom:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite,
    .card-brand-footer.pos-bottom:not(.brand-user-only):not(.brand-logo-only).user-pos-left,
    .card-brand-footer.pos-bottom-center:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite,
    .card-brand-footer.pos-bottom-center:not(.brand-user-only):not(.brand-logo-only).user-pos-left {
      justify-content: center !important;
    }

    .card-brand-footer.pos-bottom.brand-both.user-pos-opposite .card-brand-handle,
    .card-brand-footer.pos-bottom.brand-both.user-pos-left .card-brand-handle,
    .card-brand-footer.pos-bottom-center.brand-both.user-pos-opposite .card-brand-handle,
    .card-brand-footer.pos-bottom-center.brand-both.user-pos-left .card-brand-handle,
    .card-brand-footer.pos-bottom:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite .card-brand-handle,
    .card-brand-footer.pos-bottom:not(.brand-user-only):not(.brand-logo-only).user-pos-left .card-brand-handle,
    .card-brand-footer.pos-bottom-center:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite .card-brand-handle,
    .card-brand-footer.pos-bottom-center:not(.brand-user-only):not(.brand-logo-only).user-pos-left .card-brand-handle {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .card-brand-footer.pos-bottom.brand-both.user-pos-right .card-brand-handle,
    .card-brand-footer.pos-bottom-center.brand-both.user-pos-right .card-brand-handle,
    .card-brand-footer.pos-bottom:not(.brand-user-only):not(.brand-logo-only).user-pos-right .card-brand-handle,
    .card-brand-footer.pos-bottom-center:not(.brand-user-only):not(.brand-logo-only).user-pos-right .card-brand-handle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .card-brand-footer.pos-top.brand-both.user-pos-opposite,
    .card-brand-footer.pos-top.brand-both.user-pos-left,
    .card-brand-footer.pos-top-center.brand-both.user-pos-opposite,
    .card-brand-footer.pos-top-center.brand-both.user-pos-left,
    .card-brand-footer.pos-top:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite,
    .card-brand-footer.pos-top:not(.brand-user-only):not(.brand-logo-only).user-pos-left,
    .card-brand-footer.pos-top-center:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite,
    .card-brand-footer.pos-top-center:not(.brand-user-only):not(.brand-logo-only).user-pos-left {
      justify-content: center !important;
    }

    .card-brand-footer.pos-top.brand-both.user-pos-opposite .card-brand-handle,
    .card-brand-footer.pos-top.brand-both.user-pos-left .card-brand-handle,
    .card-brand-footer.pos-top-center.brand-both.user-pos-opposite .card-brand-handle,
    .card-brand-footer.pos-top-center.brand-both.user-pos-left .card-brand-handle,
    .card-brand-footer.pos-top:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite .card-brand-handle,
    .card-brand-footer.pos-top:not(.brand-user-only):not(.brand-logo-only).user-pos-left .card-brand-handle,
    .card-brand-footer.pos-top-center:not(.brand-user-only):not(.brand-logo-only).user-pos-opposite .card-brand-handle,
    .card-brand-footer.pos-top-center:not(.brand-user-only):not(.brand-logo-only).user-pos-left .card-brand-handle {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .card-brand-footer.pos-top.brand-both.user-pos-right .card-brand-handle,
    .card-brand-footer.pos-top-center.brand-both.user-pos-right .card-brand-handle,
    .card-brand-footer.pos-top:not(.brand-user-only):not(.brand-logo-only).user-pos-right .card-brand-handle,
    .card-brand-footer.pos-top-center:not(.brand-user-only):not(.brand-logo-only).user-pos-right .card-brand-handle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .card-brand-footer.pos-bottom,
    .card-brand-footer.pos-bottom-center,
    .card-watermark.pos-bottom,
    .card-watermark.pos-bottom-center {
      bottom: 20px;
      top: auto;
      left: 24px;
      right: 24px;
      justify-content: center;
      transform: none;
    }

    .card-brand-footer.pos-bottom-right,
    .card-watermark.pos-bottom-right {
      bottom: 20px;
      top: auto;
      left: 24px;
      right: 24px;
      justify-content: flex-end;
      transform: none;
    }

    .card-brand-footer.pos-bottom-left,
    .card-watermark.pos-bottom-left {
      bottom: 20px;
      top: auto;
      left: 24px;
      right: 24px;
      justify-content: flex-start;
      transform: none;
    }

    .card-brand-footer.pos-top,
    .card-brand-footer.pos-top-center,
    .card-watermark.pos-top,
    .card-watermark.pos-top-center {
      top: 20px;
      bottom: auto;
      left: 24px;
      right: 24px;
      justify-content: center;
      transform: none;
    }

    .card-brand-footer.pos-top-right,
    .card-watermark.pos-top-right {
      top: 20px;
      bottom: auto;
      left: 24px;
      right: 24px;
      justify-content: flex-end;
      transform: none;
    }

    .card-brand-footer.pos-top-left,
    .card-watermark.pos-top-left {
      top: 20px;
      bottom: auto;
      left: 24px;
      right: 24px;
      justify-content: flex-start;
      transform: none;
    }

    .card-brand-logo {
      height: 34px;
      width: auto;
      max-width: 65px;
      object-fit: contain;
      display: block;
      margin: 0;
      filter: none !important;
      box-shadow: none !important;
      opacity: 0.8;
      image-rendering: -webkit-optimize-contrast;
      transition: opacity 0.15s ease, height 0.15s ease;
    }

    .card-brand-handle {
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 11.5px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.7);
      outline: none;
      white-space: nowrap;
      display: inline-block;
      filter: none !important;
      text-shadow: none !important;
      line-height: 1.2;
      transition: color 0.15s ease, font-size 0.15s ease;
    }

    .editable {
      width: 100%;
      background: transparent;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.5;
      outline: none;
      border: none;
      text-align: center;
      word-wrap: break-word;
      white-space: pre-wrap;
      font-weight: 400;
      font-style: normal;
      cursor: text;
      transition: font-size 0.15s ease, color 0.15s ease, text-align 0.15s ease;
      user-select: text;
      -webkit-user-select: text;
      margin: auto 0;
    }

    .card.has-media .editable {
      margin: 0;
      flex: 0 0 auto;
      width: 100%;
      max-height: 38%;
      overflow-y: auto;
    }

    .editable:empty::before {
      content: "Tap to write your post, quote, or thoughts...";
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    /* Twitter / X Media Grid */
    .card-image-wrapper {
      position: relative;
      width: 100%;
      max-width: 100%;
      flex: 0 1 auto;
      display: none;
      margin: 6px auto;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.25);
      box-sizing: border-box;
      transition: max-width 0.2s ease, aspect-ratio 0.2s ease;
    }

    .card.theme-light .card-image-wrapper {
      border-color: rgba(0, 0, 0, 0.12);
      background: rgba(0, 0, 0, 0.04);
    }

    .card-image-wrapper.has-image {
      display: grid;
      width: 100%;
      max-height: 52%;
    }

    /* 1 Image: Full width, Twitter 16:9 */
    .card-image-wrapper.grid-1 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      aspect-ratio: 16 / 9;
    }

    /* 2 Images: 2 columns side by side */
    .card-image-wrapper.grid-2 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      gap: 3px;
      aspect-ratio: 16 / 9;
    }

    /* 3 Images: 1 large left, 2 stacked right */
    .card-image-wrapper.grid-3 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      aspect-ratio: 16 / 9;
    }
    .card-image-wrapper.grid-3 .x-media-cell:first-child {
      grid-column: 1;
      grid-row: 1 / span 2;
    }
    .card-image-wrapper.grid-3 .x-media-cell:nth-child(2) {
      grid-column: 2;
      grid-row: 1;
    }
    .card-image-wrapper.grid-3 .x-media-cell:nth-child(3) {
      grid-column: 2;
      grid-row: 2;
    }

    /* 4 Images: 2x2 grid */
    .card-image-wrapper.grid-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      aspect-ratio: 16 / 9;
    }

    .x-media-cell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .x-media-cell img,
    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      margin: 0 auto;
      border-radius: 0;
      transition: object-fit 0.2s ease, max-width 0.2s ease;
    }

    .remove-media-item,
    .remove-image {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      background: rgba(15, 20, 25, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      z-index: 10;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .remove-media-item:hover,
    .remove-image:hover {
      background: rgba(220, 38, 38, 0.9);
      transform: scale(1.1);
    }
    .remove-media-item:active,
    .remove-image:active {
      transform: scale(0.92);
    }

    .image-upload { display: none; }

    /* Compact & Optimized Toolbar */
    .toolbar-container {
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    /* All 13 Colour Palettes Directly in the Tools */
    .palette-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.05);
      width: 100%;
      box-sizing: border-box;
    }

    .palette-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      user-select: none;
      flex-shrink: 0;
    }

    .theme-swatches {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      width: 100%;
      justify-content: flex-start;
    }

    .theme-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }

    .theme-swatch:hover {
      transform: scale(1.22);
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      z-index: 2;
    }
    .theme-swatch:active { transform: scale(1.05); }

    .theme-swatch.active-swatch {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px var(--accent), 0 0 8px rgba(99, 102, 241, 0.5);
      transform: scale(1.15);
    }

    /* Tab Buttons: Clean Segmented Bar */
    .tool-tabs {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tool-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1 1 0;
      min-width: max-content;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab-btn:hover { color: var(--text-main); }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Tab Panels */
    .tab-panel {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      animation: fadeInPanel 0.15s ease-out;
    }

    .btn {

      height: 28px;
      padding: 0 7px;
      font-size: 11px;
      font-weight: 600;

      color: #09090b;
      border-color: #ffffff;

      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.25);

    /* Custom Color Picker Popover Modal */
    .color-panel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #14141c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 150;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      width: 250px;
      box-sizing: border-box;
      animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .color-panel.show { display: flex; }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translate(-50%, -46%) scale(0.96); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .color-panel-header {

    .popup {

      background: rgba(0, 0, 0, 0.9);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 200;
    }
    .popup.show {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-card-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 94vw;
      max-height: 85vh;
    }

    .popup-image {
      max-width: 90vw;
      max-height: 68vh;

      border-radius: 12px;

      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .popup-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      justify-content: center;
    }
    .popup-buttons .btn {
      flex: 1;
      height: 40px;
      font-size: 13px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translate(-50%, -20px);
      background: rgba(16, 185, 129, 0.95);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 250;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Mobile Responsive Optimizations (< 480px) */
    @media (max-width: 480px) {

  </style>

  <!-- Inline Tab Switcher Helper -->
  <script>
    window.switchTab = function(tabId, el) {
      document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
      document.querySelectorAll(".tab-panel").forEach(function(p) { p.classList.remove("active"); });
      if (el) el.classList.add("active");
      var p = document.getElementById(tabId);
      if (p) p.classList.add("active");
    };
  </script>

        </select>
      </div>

      <button class="btn" id="fixBtn" title="Fix Grammar & Sentences">AI Fix</button>
    </div>
  </div>

  <!-- Quick Action Bar -->
  <footer class="quick-bar">
    <button class="btn" id="clearBtn">Clear</button>
    <button class="btn btn-accent" id="previewBtn">Export High-Res PNG</button>
  </footer>

  <!-- Preview / Export Modal -->
  <div class="popup" id="popup">
    <div class="popup-card-frame">
      <img id="popupImage" class="popup-image" alt="Post preview render" />
      <div class="popup-buttons">
        <button class="btn btn-accent" id="downloadBtn">Save Image</button>
        <button class="btn" id="cancelBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- Small Custom Color Picker Panel -->
  <div class="color-panel" id="colorPanel">
    <div class="color-panel-header">
      <span id="colorPanelLabel">Custom Color</span>
    </div>
    <canvas id="colorArea" width="160" height="100"></canvas>
    <input type="range" id="hueSlider" min="0" max="360" value="210" />
    <button class="btn-mini" id="colorPanelDone" style="align-self: flex-end;">Done</button>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">Saved!</div>

  <script type="module" src="./src/main.ts"></script>

</body>
</html>
